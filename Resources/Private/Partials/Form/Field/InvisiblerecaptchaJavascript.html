<script>
    document.addEventListener('DOMContentLoaded', function() {
        document.querySelectorAll('form.powermail_form').forEach(function (form) {
            var submitButton = form.querySelector('button.g-recaptcha[data-google-recaptcha-sitekey]');
            var responseField = form.querySelector('input[name="g-recaptcha-response"]');

            if (!submitButton || !responseField) {
                return;
            }

            form.addEventListener('submit', function (event) {
                if (responseField.value) {
                    return;
                }

                event.preventDefault();
                event.stopImmediatePropagation();

                grecaptcha.ready(function () {
                    grecaptcha.execute(submitButton.dataset.googleRecaptchaSitekey, {action: 'submit'}).then(function (token) {
                        responseField.value = token;
                        if (form.requestSubmit) {
                            form.requestSubmit(submitButton);
                        } else {
                            submitButton.click();
                        }
                    });
                });
            });
        });
    });
</script>
